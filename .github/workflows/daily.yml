name: IT NEWS daily

on:
  schedule:
    # 06:17 JST primary run; 06:47 JST backup. Schedules may be delayed.
    - cron: '17 21 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/theme.css'
      - 'config/**'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: it-news-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test bilingual news rendering
        run: python -m unittest discover -s tests -v
      - name: Check today's edition
        id: edition
        run: |
          report_date=$(TZ=Asia/Tokyo date +%F)
          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          REPORT_DATE="$report_date" python - <<'PY'
          import json, os
          from pathlib import Path
          day = os.environ['REPORT_DATE']
          try:
              report = json.loads(Path(f'reports/{day}.json').read_text(encoding='utf-8'))
              exists = report.get('date') == day and isinstance(report.get('items'), list)
          except (OSError, ValueError, AttributeError):
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"exists={str(exists).lower()}\n")
          PY
      - name: Collect and publish IT news
        if: steps.edition.outputs.exists != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          REPORT_DATE: ${{ steps.edition.outputs.date }}
        run: python scripts/daily_news.py
      - name: Rebuild archived editions and date navigation
        run: python -c "from scripts.daily_news import build_site; build_site()"
      - name: Verify today's edition and website
        env:
          REPORT_DATE: ${{ steps.edition.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          day = os.environ['REPORT_DATE']
          report = json.loads(Path(f'reports/{day}.json').read_text(encoding='utf-8'))
          assert report['date'] == day and isinstance(report['items'], list)
          assert day in Path(f'docs/{day}.html').read_text(encoding='utf-8')
          assert day in Path('docs/index.html').read_text(encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Verified IT NEWS {day}: {len(report['items'])} stories (JST).\n")
          PY
      - name: Commit daily archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs reports data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "IT NEWS $(TZ=Asia/Tokyo date +%F)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase -X ours origin main
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Explain failed update
        if: failure()
        run: |
          echo "::error::IT NEWS update failed. Check the failed step; the backup schedule can retry."
          echo "### IT NEWS update failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Backup schedule: 06:47 JST. Manual retry: Run workflow." >> "$GITHUB_STEP_SUMMARY"
