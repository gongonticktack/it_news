name: IT NEWS daily

on:
  schedule:
    # 22:00 UTC is 07:00 JST on the following day.
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/theme.css'
      - 'config/**'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: it-news-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test bilingual news rendering
        run: python -m unittest discover -s tests -v
      - name: Collect and publish IT news
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/daily_news.py
      - name: Rebuild archived editions and date navigation
        run: python -c "from scripts.daily_news import build_site; build_site()"
      - name: Commit daily archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs reports data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "IT NEWS $(TZ=Asia/Tokyo date +%F)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase -X ours origin main
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
